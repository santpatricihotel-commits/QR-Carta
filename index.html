let currentLang = 'es';

function titleHTML(text) {
  return '<h2 class="text-2xl font-light tracking-wide text-emerald-800 mb-5">' + text + '</h2>';
}

function simpleItem(item) {
  const mt = item.gap ? 'mt-4' : 'mt-1.5';
  return '<div class="flex justify-between items-baseline gap-4 text-emerald-800 ' + mt + '">' +
    '<span class="font-light">' + item.name + '</span>' +
    '<span class="flex-1 dotted mx-1 mb-1"></span>' +
    '<span class="font-light whitespace-nowrap">' + item.price + '</span>' +
    '</div>';
}

function descItem(item) {
  let html = '<div class="mt-4 text-emerald-800">' +
    '<div class="flex justify-between items-baseline gap-4">' +
    '<span class="font-normal">' + item.name + '</span>' +
    '<span class="flex-1 dotted mx-1 mb-1"></span>' +
    '<span class="font-light whitespace-nowrap">' + item.price + '</span>' +
    '</div>';
  if (item.desc) {
    html += '<p class="text-sm text-emerald-600 font-light mt-1 leading-snug">' + item.desc + '</p>';
  }
  return html + '</div>';
}

function render() {
  const t = translations[currentLang];
  document.documentElement.lang = currentLang;

  // Barra de idiomas
  const bar = document.getElementById('langBar');
  bar.innerHTML = '';
  Object.keys(translations).forEach(function (key) {
    const btn = document.createElement('button');
    btn.textContent = translations[key].label;
    const active = key === currentLang;
    btn.className = 'px-4 py-1.5 rounded-full text-sm tracking-wide transition-colors ' +
      (active ? 'bg-emerald-800 text-stone-50'
              : 'bg-transparent text-emerald-800 border border-emerald-200 hover:bg-emerald-100');
    btn.onclick = function () { currentLang = key; render(); };
    bar.appendChild(btn);
  });

  document.getElementById('carta').textContent = t.carta;
  document.getElementById('hours').textContent = t.hours;
  document.getElementById('allergies').textContent = t.allergies;

  let html = '';

  // Bebidas
  html += '<section class="mb-12">' + titleHTML(t.drinks) + '<div>';
  t.drinksItems.forEach(function (i) { html += simpleItem(i); });
  html += '</div></section>';

  // Vinos
  html += '<section class="mb-12">' + titleHTML(t.wines);
  html += '<div class="flex justify-end gap-6 text-xs tracking-widest text-emerald-400 mb-2">' +
    '<span class="w-16 text-right">' + t.glass + '</span>' +
    '<span class="w-16 text-right">' + t.bottle + '</span></div><div>';
  t.winesGlass.forEach(function (w) {
    html += '<div class="flex items-baseline gap-4 mt-1.5">' +
      '<span class="font-light flex-1">' + w.name + '</span>' +
      '<span class="w-16 text-right font-light">' + w.glass + '</span>' +
      '<span class="w-16 text-right font-light">' + w.bottle + '</span></div>';
  });
  html += '</div><div class="mt-4">';
  t.winesBottle.forEach(function (w) {
    html += '<div class="flex items-baseline gap-4 mt-1.5">' +
      '<span class="font-light flex-1">' + w.name + '</span>' +
      '<span class="w-16"></span>' +
      '<span class="w-16 text-right font-light">' + w.bottle + '</span></div>';
  });
  html += '</div></section>';

  // Tapas
  html += '<section class="mb-12">' + titleHTML(t.tapas) + '<div>';
  t.tapasItems.forEach(function (i) { html += descItem(i); });
  html += '</div></section>';

  // Snacks
  html += '<section class="mb-8">' + titleHTML(t.snacks) + '<div>';
  t.snacksItems.forEach(function (i) { html += simpleItem(i); });
  html += '</div></section>';

  document.getElementById('content').innerHTML = html;
}

// Respaldo del logo si no carga
document.getElementById('logo').addEventListener('error', function () {
  this.classList.add('hidden');
  const fb = document.getElementById('logoFallback');
  fb.classList.remove('hidden');
  fb.classList.add('flex');
});

render();
